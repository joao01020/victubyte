cat > .github/workflows/build.yml <<'EOF'
name: Godot Project Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Godot Project

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Import and validate project
        run: godot --headless --editor --path . --quit
EOF